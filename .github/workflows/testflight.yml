name: iPad TestFlight upload
on:
  workflow_dispatch:
  # Bootstrap before this workflow has been merged to the default branch.
  # Push this dedicated branch only when the signing secrets are ready.
  push:
    branches: [testflight-upload]
permissions:
  contents: read
concurrency:
  group: ipad-testflight
  cancel-in-progress: false
jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || '6K3LEDS6UA' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check signing secrets
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          for name in BUILD_CERTIFICATE_BASE64 P12_PASSWORD BUILD_PROVISION_PROFILE_BASE64 ASC_PRIVATE_KEY_BASE64 ASC_KEY_ID ASC_ISSUER_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required GitHub Actions secret is missing: $name"
              exit 1
            fi
          done
      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
      # Restore only. Never save signed products or signing metadata in a cache.
      - uses: actions/cache/restore@v4
        with:
          path: build-ipad
          key: ipad-xcode26.3-iphoneos-${{ hashFiles('ipad/CMakeLists.txt') }}
          restore-keys: ipad-xcode26.3-iphoneos-
      - name: Install temporary signing credentials
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          umask 077
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/tuxpaint.p12"
          printf '%s' "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/tuxpaint.mobileprovision"
          printf '%s' "$ASC_PRIVATE_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/tuxpaint-auth.p8"
          security cms -D -i "$RUNNER_TEMP/tuxpaint.mobileprovision" > "$RUNNER_TEMP/tuxpaint-profile.plist"
          profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/tuxpaint-profile.plist")
          profile_team=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/tuxpaint-profile.plist")
          profile_app=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/tuxpaint-profile.plist")
          echo "::add-mask::$profile_uuid"
          test "$profile_team" = "$APPLE_TEAM_ID"
          test "$profile_app" = "$APPLE_TEAM_ID.org.ladyada.tuxpaint.ipad"
          test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$RUNNER_TEMP/tuxpaint-profile.plist")" = false
          if /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$RUNNER_TEMP/tuxpaint-profile.plist" > /dev/null 2>&1 || /usr/libexec/PlistBuddy -c 'Print :ProvisionsAllDevices' "$RUNNER_TEMP/tuxpaint-profile.plist" > /dev/null 2>&1; then
            echo '::error::An App Store distribution profile is required.'
            exit 1
          fi
          echo "PROFILE_UUID=$profile_uuid" >> "$GITHUB_ENV"
          keychain_password=$(openssl rand -hex 32)
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$RUNNER_TEMP/tuxpaint.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/tuxpaint.keychain-db"
          security unlock-keychain -p "$keychain_password" "$RUNNER_TEMP/tuxpaint.keychain-db"
          security import "$RUNNER_TEMP/tuxpaint.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/tuxpaint.keychain-db" > /dev/null
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$RUNNER_TEMP/tuxpaint.keychain-db" > /dev/null
          security list-keychains -d user -s "$RUNNER_TEMP/tuxpaint.keychain-db"
          mkdir -p "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          cp "$RUNNER_TEMP/tuxpaint.mobileprovision" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/tuxpaint-testflight.mobileprovision"
      - name: Configure signed device build
        run: |
          cmake -S ipad -B build-ipad -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DTUXPAINT_BUILD_NUMBER="$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" \
            -DTUXPAINT_SIGNING_TEAM="$APPLE_TEAM_ID" \
            -DTUXPAINT_SIGNING_PROFILE="$PROFILE_UUID"
      - name: Archive signed iPad app
        run: |
          xcodebuild -project build-ipad/TuxPaintIPad.xcodeproj \
            -scheme TuxPaint -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/TuxPaint.xcarchive" \
            -jobs 3 archive
      - name: Upload archive to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cp ipad/ExportOptions.plist "$RUNNER_TEMP/TuxPaintExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Set :teamID $APPLE_TEAM_ID" "$RUNNER_TEMP/TuxPaintExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Set :provisioningProfiles:org.ladyada.tuxpaint.ipad $PROFILE_UUID" "$RUNNER_TEMP/TuxPaintExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/TuxPaint.xcarchive" \
            -exportPath "$RUNNER_TEMP/TuxPaintExport" \
            -exportOptionsPlist "$RUNNER_TEMP/TuxPaintExportOptions.plist" \
            -authenticationKeyPath "$RUNNER_TEMP/tuxpaint-auth.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -allowProvisioningUpdates
          echo "Uploaded build $GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT; Apple processing and tester assignment remain in App Store Connect." >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary signing credentials
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/tuxpaint.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/tuxpaint.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/tuxpaint.p12" "$RUNNER_TEMP/tuxpaint.mobileprovision" \
            "$RUNNER_TEMP/tuxpaint-auth.p8" "$RUNNER_TEMP/tuxpaint-profile.plist" \
            "$RUNNER_TEMP/TuxPaintExportOptions.plist" \
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/tuxpaint-testflight.mobileprovision"
