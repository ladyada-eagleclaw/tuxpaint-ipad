name: iPad build
on:
  push:
    branches: [ipad-cloud-build]
  workflow_dispatch:
    inputs:
      devices:
        description: Simulator coverage
        type: choice
        options: [all, pro, phone, mini]
        default: all
permissions:
  contents: read
concurrency:
  group: ipad-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        sdk: [iphoneos, iphonesimulator]
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
      - uses: actions/cache/restore@v4
        id: build-cache
        with:
          path: build-ipad
          key: ipad-xcode26.3-${{ matrix.sdk }}-${{ hashFiles('ipad/CMakeLists.txt') }}
          restore-keys: ipad-xcode26.3-${{ matrix.sdk }}-
      - name: Configure
        run: >-
          cmake -S ipad -B build-ipad -G Xcode
          -DCMAKE_SYSTEM_NAME=iOS
          -DCMAKE_OSX_SYSROOT=${{ matrix.sdk }}
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - name: Check canvas gestures and coordinates
        if: matrix.sdk == 'iphonesimulator'
        run: |
          cc -std=c11 -Wall -Wextra -Werror ipad/CanvasView.c ipad/tests/canvas_view_test.c -lm -o "$RUNNER_TEMP/canvas-view-test"
          "$RUNNER_TEMP/canvas-view-test"
          python3 -m pip install --user --break-system-packages pillow
      - name: Compile
        run: cmake --build build-ipad --config Release --target TuxPaint --parallel 3
      - name: Package unsigned app
        run: |
          mkdir -p artifacts
          app=$(find build-ipad -maxdepth 3 -name TuxPaint.app -type d | head -1)
          test -n "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" artifacts/TuxPaint-${{ matrix.sdk }}.zip
      - name: Launch on iPad and iPhone simulators
        if: matrix.sdk == 'iphonesimulator'
        run: |
          runtime=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; rs=json.load(sys.stdin)["runtimes"]; print(next(r["identifier"] for r in reversed(rs) if r["isAvailable"] and "iOS" in r["name"]))')
          app=$(find build-ipad -maxdepth 3 -name TuxPaint.app -type d | head -1)
          for model in 'iPhone 16' 'iPad mini (6th generation)' 'iPad Pro (12.9-inch) (5th generation)'; do
            if [[ '${{ inputs.devices }}' == phone && "$model" != 'iPhone 16' ]]; then
              continue
            fi
            if [[ '${{ inputs.devices }}' == mini && "$model" != 'iPad mini (6th generation)' ]]; then
              continue
            fi
            if [[ '${{ inputs.devices }}' == pro && "$model" != 'iPad Pro (12.9-inch) (5th generation)' ]]; then
              continue
            fi
            device_type=$(xcrun simctl list devicetypes -j | MODEL="$model" python3 -c 'import json,os,sys; ds=json.load(sys.stdin)["devicetypes"]; print(next(d["identifier"] for d in ds if d["name"] == os.environ["MODEL"]))')
            device=$(xcrun simctl create "Tux Paint $model" "$device_type" "$runtime")
            mkdir -p "artifacts/$model"
            xcrun simctl boot "$device"
            xcrun simctl bootstatus "$device" -b
            xcrun simctl install "$device" "$app"
            recovery_mode=""
            feature_mode=checks
            if [[ "$model" == 'iPad Pro (12.9-inch) (5th generation)' ]]; then
              recovery_mode=seed
              feature_mode=""
            fi
            launch_result=$(SIMCTL_CHILD_TUXPAINT_TEST_RECOVERY="$recovery_mode" SIMCTL_CHILD_TUXPAINT_TEST_FEATURES="$feature_mode" xcrun simctl launch --stdout="$PWD/artifacts/$model/app-stdout.txt" --stderr="$PWD/artifacts/$model/app-stderr.txt" "$device" org.ladyada.tuxpaint.ipad)
            echo "$model: $launch_result"
            app_pid=${launch_result##*: }
            sleep 15
            container=$(xcrun simctl get_app_container "$device" org.ladyada.tuxpaint.ipad data)
            drawings="$container/Library/Application Support/TuxPaint"
            if [[ "$recovery_mode" == seed ]]; then
              for attempt in {1..45}; do
                [[ -f "$drawings/recovery-seeded.txt" ]] && break
                sleep 1
              done
              test -f "$drawings/recovery-seeded.txt"
              # A real UIKit transition, followed by process termination/relaunch.
              xcrun simctl launch "$device" com.apple.Preferences
              for attempt in {1..15}; do
                [[ -s "$drawings/saved/AUTOSAVED.png" ]] && break
                sleep 1
              done
              test -s "$drawings/saved/AUTOSAVED.png"
              cp "$drawings/saved/AUTOSAVED.png" "artifacts/$model/recovery.png"
              xcrun simctl terminate "$device" org.ladyada.tuxpaint.ipad
              cp "$drawings/saved/AUTOSAVED.png" "artifacts/$model/recovery-after-termination.png"
              launch_result=$(SIMCTL_CHILD_TUXPAINT_TEST_RECOVERY=verify SIMCTL_CHILD_TUXPAINT_TEST_FEATURES=checks xcrun simctl launch --stdout="$PWD/artifacts/$model/restore-stdout.txt" --stderr="$PWD/artifacts/$model/restore-stderr.txt" "$device" org.ladyada.tuxpaint.ipad)
              app_pid=${launch_result##*: }
              for attempt in {1..45}; do
                [[ -f "$drawings/recovery-verified.txt" ]] && break
                sleep 1
              done
              if [[ -f "$drawings/recovery-actual.png" ]]; then
                cp "$drawings/recovery-actual.png" "artifacts/$model/"
              fi
              test -f "$drawings/recovery-verified.txt"
              cp "$drawings/recovery-verified.txt" "artifacts/$model/"
              echo 'PASS: drawing survived background, termination, and relaunch.'
            fi
            for attempt in {1..45}; do
              [[ -f "$drawings/zoom-ready.txt" ]] && break
              sleep 1
            done
            test -f "$drawings/zoom-ready.txt"
            xcrun simctl io "$device" screenshot "artifacts/$model/zoom.png"
            cp "$drawings/zoom-sample.txt" "artifacts/$model/"
            # Check the displayed pixel as well as the saved canvas pixels.
            python3 - "artifacts/$model" <<'PY'
          import pathlib, sys
          from PIL import Image, ImageChops
          folder = pathlib.Path(sys.argv[1])
          x, y, w, h = map(float, (folder / 'zoom-sample.txt').read_text().split())
          im = Image.open(folder / 'zoom.png').convert('RGB')
          # iPads can letterbox a landscape app inside a portrait screenshot.
          left, top, right, bottom = ImageChops.difference(im, Image.new('RGB', im.size)).getbbox()
          width, height = right-left, bottom-top
          if (width > height) == (w > h):
              px, py = left + round(x * width / w), top + round(y * height / h)
          else:
              px, py = right - 1 - round(y * width / h), top + round(x * height / w)
          pixels = [im.getpixel((xx, yy)) for yy in range(max(0, py-8), min(im.height, py+9))
                    for xx in range(max(0, px-8), min(im.width, px+9))]
          assert any(max(rgb) < 100 for rgb in pixels), f'Paint is not visible near screenshot pixel {px},{py}'
          print('PASS: zoomed stroke is visible at its touch position in the simulator screenshot')
          PY
            touch "$drawings/zoom-captured.txt"
            for attempt in {1..45}; do
              [[ -f "$drawings/features-verified.txt" ]] && break
              sleep 1
            done
            test -f "$drawings/features-verified.txt"
            cp "$drawings/features-verified.txt" "artifacts/$model/"
            cp "$container/tmp/Tux Paint Drawing.png" "artifacts/$model/shared-drawing.png"
            xcrun simctl io "$device" screenshot "artifacts/$model/launch.png"
            xcrun simctl terminate "$device" org.ladyada.tuxpaint.ipad
            SIMCTL_CHILD_TUXPAINT_TEST_FEATURES=share-only xcrun simctl launch --stderr="$PWD/artifacts/$model/share-stderr.txt" "$device" org.ladyada.tuxpaint.ipad
            for attempt in {1..45}; do
              [[ -f "$drawings/share-presented.txt" ]] && break
              sleep 1
            done
            test -f "$drawings/share-presented.txt"
            cp "$drawings/share-presented.txt" "artifacts/$model/"
            sleep 2
            xcrun simctl io "$device" screenshot "artifacts/$model/share.png"
            xcrun simctl terminate "$device" org.ladyada.tuxpaint.ipad
            xcrun simctl privacy "$device" grant photos-add org.ladyada.tuxpaint.ipad
            launch_result=$(SIMCTL_CHILD_TUXPAINT_TEST_FEATURES=photos-only xcrun simctl launch --stderr="$PWD/artifacts/$model/photos-stderr.txt" "$device" org.ladyada.tuxpaint.ipad)
            app_pid=${launch_result##*: }
            for attempt in {1..45}; do
              [[ -f "$drawings/photos-verified.txt" ]] && break
              sleep 1
            done
            test -f "$drawings/photos-verified.txt"
            cp "$drawings/photos-verified.txt" "artifacts/$model/"
            xcrun simctl io "$device" screenshot "artifacts/$model/photos.png"
            cat "artifacts/$model/app-stdout.txt" "artifacts/$model/app-stderr.txt"
            find "$HOME/Library/Logs/DiagnosticReports" -name 'TuxPaint*' -exec cp {} "artifacts/$model/" \;
            find "$HOME/Library/Developer/CoreSimulator/Devices/$device/data/Library/Logs" -name 'TuxPaint*' -exec cp {} "artifacts/$model/" \;
            xcrun simctl spawn "$device" log show --style compact --last 5m --predicate 'process == "TuxPaint" OR eventMessage CONTAINS "org.ladyada.tuxpaint.ipad"' > "artifacts/$model/simulator.log"
            ps -p "$app_pid" -o pid=,comm=
            xcrun simctl shutdown "$device"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TuxPaint-${{ matrix.sdk }}
          path: artifacts/
          retention-days: 7
      - uses: actions/cache/save@v4
        if: always() && steps.build-cache.outputs.cache-hit != 'true'
        with:
          path: build-ipad
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
