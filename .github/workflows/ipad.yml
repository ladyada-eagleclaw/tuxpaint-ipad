name: iPad build
on:
  push:
    branches: [ipad-cloud-build]
  workflow_dispatch:
    inputs:
      devices:
        description: Simulator coverage
        type: choice
        options: [all, pro]
        default: all
permissions:
  contents: read
concurrency:
  group: ipad-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        sdk: [iphoneos, iphonesimulator]
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
      - uses: actions/cache/restore@v4
        id: build-cache
        with:
          path: build-ipad
          key: ipad-xcode26.3-${{ matrix.sdk }}-${{ hashFiles('ipad/CMakeLists.txt') }}
          restore-keys: ipad-xcode26.3-${{ matrix.sdk }}-
      - name: Configure
        run: >-
          cmake -S ipad -B build-ipad -G Xcode
          -DCMAKE_SYSTEM_NAME=iOS
          -DCMAKE_OSX_SYSROOT=${{ matrix.sdk }}
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - name: Check canvas gestures and coordinates
        if: matrix.sdk == 'iphonesimulator'
        run: |
          cc -std=c11 -Wall -Wextra -Werror ipad/CanvasView.c ipad/tests/canvas_view_test.c -lm -o "$RUNNER_TEMP/canvas-view-test"
          "$RUNNER_TEMP/canvas-view-test"
      - name: Compile
        run: cmake --build build-ipad --config Release --target TuxPaint --parallel 3
      - name: Package unsigned app
        run: |
          mkdir -p artifacts
          app=$(find build-ipad -maxdepth 3 -name TuxPaint.app -type d | head -1)
          test -n "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" artifacts/TuxPaint-${{ matrix.sdk }}.zip
      - name: Launch on iPad and iPhone simulators
        if: matrix.sdk == 'iphonesimulator'
        run: |
          runtime=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; rs=json.load(sys.stdin)["runtimes"]; print(next(r["identifier"] for r in reversed(rs) if r["isAvailable"] and "iOS" in r["name"]))')
          app=$(find build-ipad -maxdepth 3 -name TuxPaint.app -type d | head -1)
          for model in 'iPad Pro (12.9-inch) (5th generation)' 'iPad mini (6th generation)' 'iPhone 16'; do
            if [[ '${{ inputs.devices }}' == pro && "$model" != 'iPad Pro (12.9-inch) (5th generation)' ]]; then
              continue
            fi
            device_type=$(xcrun simctl list devicetypes -j | MODEL="$model" python3 -c 'import json,os,sys; ds=json.load(sys.stdin)["devicetypes"]; print(next(d["identifier"] for d in ds if d["name"] == os.environ["MODEL"]))')
            device=$(xcrun simctl create "Tux Paint $model" "$device_type" "$runtime")
            mkdir -p "artifacts/$model"
            xcrun simctl boot "$device"
            xcrun simctl bootstatus "$device" -b
            xcrun simctl install "$device" "$app"
            recovery_mode=""
            if [[ "$model" == 'iPad Pro (12.9-inch) (5th generation)' ]]; then
              recovery_mode=seed
            fi
            launch_result=$(SIMCTL_CHILD_TUXPAINT_TEST_RECOVERY="$recovery_mode" xcrun simctl launch --stdout="$PWD/artifacts/$model/app-stdout.txt" --stderr="$PWD/artifacts/$model/app-stderr.txt" "$device" org.ladyada.tuxpaint.ipad)
            echo "$model: $launch_result"
            app_pid=${launch_result##*: }
            sleep 15
            if [[ "$recovery_mode" == seed ]]; then
              container=$(xcrun simctl get_app_container "$device" org.ladyada.tuxpaint.ipad data)
              drawings="$container/Library/Application Support/TuxPaint"
              for attempt in {1..45}; do
                [[ -f "$drawings/recovery-seeded.txt" ]] && break
                sleep 1
              done
              test -f "$drawings/recovery-seeded.txt"
              # A real UIKit transition, followed by process termination/relaunch.
              xcrun simctl launch "$device" com.apple.Preferences
              for attempt in {1..15}; do
                [[ -s "$drawings/saved/AUTOSAVED.png" ]] && break
                sleep 1
              done
              test -s "$drawings/saved/AUTOSAVED.png"
              cp "$drawings/saved/AUTOSAVED.png" "artifacts/$model/recovery.png"
              xcrun simctl terminate "$device" org.ladyada.tuxpaint.ipad
              cp "$drawings/saved/AUTOSAVED.png" "artifacts/$model/recovery-after-termination.png"
              launch_result=$(SIMCTL_CHILD_TUXPAINT_TEST_RECOVERY=verify xcrun simctl launch --stdout="$PWD/artifacts/$model/restore-stdout.txt" --stderr="$PWD/artifacts/$model/restore-stderr.txt" "$device" org.ladyada.tuxpaint.ipad)
              app_pid=${launch_result##*: }
              for attempt in {1..45}; do
                [[ -f "$drawings/recovery-verified.txt" ]] && break
                sleep 1
              done
              if [[ -f "$drawings/recovery-actual.png" ]]; then
                cp "$drawings/recovery-actual.png" "artifacts/$model/"
              fi
              test -f "$drawings/recovery-verified.txt"
              cp "$drawings/recovery-verified.txt" "artifacts/$model/"
              echo 'PASS: drawing survived background, termination, and relaunch.'
            fi
            xcrun simctl io "$device" screenshot "artifacts/$model/launch.png"
            cat "artifacts/$model/app-stdout.txt" "artifacts/$model/app-stderr.txt"
            find "$HOME/Library/Logs/DiagnosticReports" -name 'TuxPaint*' -exec cp {} "artifacts/$model/" \;
            find "$HOME/Library/Developer/CoreSimulator/Devices/$device/data/Library/Logs" -name 'TuxPaint*' -exec cp {} "artifacts/$model/" \;
            xcrun simctl spawn "$device" log show --style compact --last 5m --predicate 'process == "TuxPaint" OR eventMessage CONTAINS "org.ladyada.tuxpaint.ipad"' > "artifacts/$model/simulator.log"
            ps -p "$app_pid" -o pid=,comm=
            xcrun simctl shutdown "$device"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TuxPaint-${{ matrix.sdk }}
          path: artifacts/
          retention-days: 7
      - uses: actions/cache/save@v4
        if: always() && steps.build-cache.outputs.cache-hit != 'true'
        with:
          path: build-ipad
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
