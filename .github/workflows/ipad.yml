name: iPad build
on:
  push:
    branches: [ipad-cloud-build]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ipad-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        sdk: [iphoneos, iphonesimulator]
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
      - uses: actions/cache/restore@v4
        id: build-cache
        with:
          path: build-ipad
          key: ipad-xcode26.3-${{ matrix.sdk }}-${{ hashFiles('ipad/CMakeLists.txt') }}
          restore-keys: ipad-xcode26.3-${{ matrix.sdk }}-
      - name: Configure
        run: >-
          cmake -S ipad -B build-ipad -G Xcode
          -DCMAKE_SYSTEM_NAME=iOS
          -DCMAKE_OSX_SYSROOT=${{ matrix.sdk }}
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - name: Compile
        run: cmake --build build-ipad --config Release --target TuxPaint --parallel 3
      - name: Package unsigned app
        run: |
          mkdir -p artifacts
          app=$(find build-ipad -maxdepth 3 -name TuxPaint.app -type d | head -1)
          test -n "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" artifacts/TuxPaint-${{ matrix.sdk }}.zip
      - name: Launch on iPad simulator
        if: matrix.sdk == 'iphonesimulator'
        run: |
          device_type=$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys; ds=json.load(sys.stdin)["devicetypes"]; print(next(d["identifier"] for d in ds if "12.9" in d["name"] and "5th generation" in d["name"]))')
          runtime=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; rs=json.load(sys.stdin)["runtimes"]; print(next(r["identifier"] for r in reversed(rs) if r["isAvailable"] and "iOS" in r["name"]))')
          device=$(xcrun simctl create "Luna iPad Pro 12.9" "$device_type" "$runtime")
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          app=$(find build-ipad -maxdepth 3 -name TuxPaint.app -type d | head -1)
          xcrun simctl install "$device" "$app"
          xcrun simctl launch "$device" org.ladyada.tuxpaint.ipad
          sleep 15
          xcrun simctl spawn "$device" launchctl list | grep org.ladyada.tuxpaint.ipad
          xcrun simctl io "$device" screenshot artifacts/ipad-launch.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TuxPaint-${{ matrix.sdk }}
          path: artifacts/
          retention-days: 7
      - uses: actions/cache/save@v4
        if: always() && steps.build-cache.outputs.cache-hit != 'true'
        with:
          path: build-ipad
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
